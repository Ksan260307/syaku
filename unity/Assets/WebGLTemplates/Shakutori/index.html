<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <meta name="description" content="小さなしゃくとりむしになって、アニメ調の森・川辺・公園をのんびり探検する 3D オープンワールド。スマホ・タブレットでも遊べます。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="しゃくとりの森 — Inchworm Forest">
  <meta property="og:description" content="小さなしゃくとりむしになって、森や川辺、公園をのんびり探検しよう。">
  <meta property="og:image" content="icon.png">
  <meta name="theme-color" content="#263a28">
  <title>しゃくとりの森 — Inchworm Forest</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #263a28;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #unity-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #263a28; outline: none; touch-action: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 40%, #3f6a3b 0%, #263a28 70%);
      color: #f0f6e4; transition: opacity .8s ease; z-index: 2;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: inch 1.6s ease-in-out infinite; }
    @keyframes inch { 0%,100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-8px) scaleX(.92); } }
    #loading h1 { margin: 0; font-size: clamp(30px, 6vw, 54px); letter-spacing: .18em; font-weight: 800; text-shadow: 0 4px 16px rgba(0,0,0,.35); }
    #loading .sub { margin-top: -14px; font-size: 13px; letter-spacing: .5em; color: #ffe9b8; opacity: .9; }
    #bar { width: min(420px, 70vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #9fd35f, #e8e27a); transition: width .2s; }
    #tip { font-size: 14px; color: #cfe2c4; min-height: 1.4em; text-align: center; padding: 0 20px; }
    #pct { margin-top: -12px; font-size: 13px; color: #a9c79a; letter-spacing: .1em; }
    #error button { margin-left: 12px; padding: 6px 14px; border-radius: 14px; border: 2px solid #c79a5a; background: #f6cd6e; color: #4a3014; font-weight: 700; cursor: pointer; }
    #error { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #fff6e6; color: #6a3a2a; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 3; max-width: 80vw; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <img src="icon.png" alt="">
    <h1>しゃくとりの森</h1>
    <div class="sub">INCHWORM FOREST</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="tip">しゃくとりむしは、体を「Ω」の字にまげて進みます</div>
  </div>
  <div id="error"></div>
  <noscript><p style="color:#fff;text-align:center;margin-top:40vh">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
  <script>
    const tips = [
      "しゃくとりむしは、体を「Ω」の字にまげて進みます",
      "キノコの柄も、切り株の壁も、しゃくとりむしなら登れます",
      "高い所からは、糸を出してゆっくり下りられます",
      "E キーを長押しすると、背伸びしてあたりを見わたせます",
      "森のどこかに 45 個の「森のしずく」がかくれています",
      "森の東のはしの、木の根のトンネルを抜けると川辺に出られます",
      "いきものに近づくと、図鑑に登録されます",
      "スマホでは、画面の左側に指を置くとスティックが出ます",
    ];
    let tipIndex = 0;
    const tipEl = document.getElementById("tip");
    const tipTimer = setInterval(() => { tipIndex = (tipIndex + 1) % tips.length; tipEl.textContent = tips[tipIndex]; }, 3500);

    const canvas = document.getElementById("unity-canvas");
    const fill = document.getElementById("fill");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");

    const pct = document.getElementById("pct");

    function unityShowBanner(msg, type) {
      if (type === "error") showError(msg);
      else console.log(msg);
    }

    // エラーのときは「もう一度読み込む」ボタンを出す
    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
      const retry = document.createElement("button");
      retry.textContent = "もう一度読み込む";
      retry.onclick = () => location.reload();
      errorBox.appendChild(retry);
    }

    // WebGL 2.0 が使えないブラウザでは、わかりやすく伝える
    if (!document.createElement("canvas").getContext("webgl2")) {
      showError("このブラウザでは遊べません（WebGL 2.0 が必要です）。新しい Chrome / Edge / Safari / Firefox でひらいてください。");
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
      autoSyncPersistentDataPath: true,
    };

    // iPadOS の Safari は Mac と名乗るので、タッチ点の数でも判定する
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);

    // iOS のピンチ・ダブルタップ拡大やスクロールでページが動かないようにする
    const stop = (e) => e.preventDefault();
    document.addEventListener("gesturestart", stop, { passive: false });
    document.addEventListener("gesturechange", stop, { passive: false });
    document.addEventListener("dblclick", stop, { passive: false });
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd < 320) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        fill.style.width = (progress * 100) + "%";
        pct.textContent = Math.round(progress * 100) + "%";
      }).then(() => {
        clearInterval(tipTimer);
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 900);
        canvas.focus();
      }).catch((message) => {
        showError("読み込みに失敗しました: " + message);
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("pointerdown", () => canvas.focus());
  </script>
</body>
</html>
